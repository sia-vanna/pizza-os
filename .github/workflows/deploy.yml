name: deploy pizza-os
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install OS toolchain
        run: sudo apt-get update && sudo apt-get install -y nasm g++-multilib binutils grub-common
      - run: npm install
      - run: npm run k:build
      - run: npm run k:check
      - run: node -c server.js && echo "✅ server.js valid"

  deploy:
    if: github.event_name!= 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: "."
          target: "/opt/pizza-os"
          rm: false

      - name: Restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e
            cd /opt/pizza-os

            # install kernel toolchain on droplet if missing
            sudo apt-get update -qq
            sudo apt-get install -y -qq nasm g++-multilib binutils grub-common xorriso mtools qemu-system-x86 > /dev/null

            npm install --production

            # BUILD KERNEL ON SERVER (fixes PVH NOTE)
            npm run k:build
            npm run k:check

            # copy web files + bin to nginx root
            sudo mkdir -p /var/www/pizza-os
            sudo cp -r public/* /var/www/pizza-os/ 2>/dev/null || true
            sudo cp pizza-os.bin /var/www/pizza-os/ 2>/dev/null || true
            sudo cp pizza-os.iso /var/www/pizza-os/ 2>/dev/null || true
            sudo chown -R www-data:www-data /var/www/pizza-os
            sudo chown -R $USER:www-data /opt/pizza-os

            npm install -g pm2 || true
            pm2 restart pizza-os || pm2 start server.js --name pizza-os --update-env
            pm2 save

            sudo nginx -t && sudo systemctl reload nginx
            echo "🍕 Deployed ${{ github.actor }} -> https://hacking-pizza.ca - ${{ github.sha }}"
            ls -lh pizza-os.bin
            readelf -l pizza-os.bin | grep -A1 NOTE

      - name: Notify Discord
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then COLOR=3066993; EMOJI="🍕✅"; MSG="Deployed!"; else COLOR=15158332; EMOJI="🍕❌"; MSG="FAILED!"; fi
          curl -s -H "Content-Type: application/json" -d "{\"embeds\": [{\"title\": \"$EMOJI $MSG - ${{ github.actor }}\", \"color\": $COLOR, \"fields\": [{\"name\": \"Commit\", \"value\": \"\`${{ github.sha }}\`\"}, {\"name\": \"Site\", \"value\": \"[hacking-pizza.ca](https://hacking-pizza.ca)\"}], \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}]}" ${{ secrets.DISCORD_WEBHOOK_URL }} || echo "no webhook set"
